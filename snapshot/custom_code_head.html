/* ---- Hero portrait ---- */
/* two elements share id="top" on this page (Odoo's wrapper + the hero section),
   and the hero carries an inline max-width, so scope tightly and force the
   full-bleed with !important — otherwise the band stops at 78rem. */
section#top{position:relative;max-width:none !important;overflow:hidden;}
section#top > .reveal,section#top > h1{position:relative;z-index:2;}
.jd-hero-portrait{
  --portrait-w:min(62vw,940px);
  --portrait-shift:16vw;   /* pushes the frame right so the near shoulder runs off the page */
  --portrait-feather:20vw; /* how far the left dissolve runs before it is fully opaque */
  --portrait-lean:95deg;   /* 90deg = vertical edge; 95deg rakes the edge 5° forward */
  --portrait-pad:5vw;      /* a raked edge travels sideways across the frame's height;
                              without this pad the fade starts left of the image's own
                              (vertical) left edge near the bottom and that edge shows */
  --portrait-opacity:.85;
  position:absolute;top:0;right:0;bottom:0;width:var(--portrait-w);
  mix-blend-mode:multiply;opacity:var(--portrait-opacity);z-index:1;
  /* One fade only, on the left: it starts where the shifted image starts (any
     earlier and the mask wastes its ramp on empty space, any later and the
     image's own edge shows as a seam). The right side runs hard off the page.
     The 5° lean makes the dissolve a raked edge rather than a ruled line. */
  -webkit-mask-image:linear-gradient(var(--portrait-lean),transparent calc(var(--portrait-shift) + var(--portrait-pad)),#000 calc(var(--portrait-shift) + var(--portrait-pad) + var(--portrait-feather)));
  mask-image:linear-gradient(var(--portrait-lean),transparent calc(var(--portrait-shift) + var(--portrait-pad)),#000 calc(var(--portrait-shift) + var(--portrait-pad) + var(--portrait-feather)));
}
/* a real <img> so it can be swapped in the builder (double-click -> Replace).
   !important guards against the classes Odoo's editor adds on replace
   (img-fluid sets height:auto, which would collapse the frame). */
.jd-hero-portrait img{
  display:block!important;width:100%!important;height:100%!important;
  object-fit:cover!important;
  object-position:calc(100% + var(--portrait-shift)) center!important;
  max-width:none!important;border-radius:0!important;
}
@media (max-width:900px){
  /* No fade here. The frame goes full-bleed so the image overflows both sides
     and has no visible edge to hide, which is the only thing the mask was for.
     Opacity alone keeps the headline readable. */
  .jd-hero-portrait{--portrait-w:100vw;--portrait-shift:22vw;--portrait-opacity:.55;}
  .jd-hero-portrait{-webkit-mask-image:none;mask-image:none;}
}

/* ---- Entries banner (blog index) ---- */
/* Odoo ships this banner assuming a dark cover image sits behind it, so the
   wrapper carries Bootstrap's .text-white (a !important utility) and the
   subtitle renders muddy over paper. Scoped to .text-white so individual post
   headers, which use the same classes without it, are untouched. */
/* a dark cover photo sits behind this banner, so the brand colours here are the
   light end of the palette: vermilion headline, paper subhead. */
#wrap .o_wblog_post_title .text-white{color:var(--paper)!important;}
/* paper at 72% so Judge's cover photo reads through the letterforms */
#wrap .o_wblog_post_title .text-white h1.o_wblog_post_name{color:rgba(242,236,223,.72)!important;opacity:1;text-shadow:0 2px 22px rgba(0,0,0,.35);}

/* ---- Judge Quote Page (s_jd_quote_page) ---- */
/* Odoo paints the builder-chosen background image onto the <section> itself, and
   a background-image covers that element's own background-color — so the veil
   has to be a separate child, and the colour-combination class on the section is
   what decides whether that veil is paper or ink. */
.s_jd_quotepage{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;min-height:60vh;padding:clamp(6rem,18vh,12rem) var(--page-gutter);background-size:cover;background-position:center;}
.s_jd_quotepage_scrim{position:absolute;inset:0;z-index:0;pointer-events:none;}
.s_jd_quotepage_inner{position:relative;z-index:1;width:100%;max-width:var(--content-max);margin:0 auto;text-align:center;}
.s_jd_quotepage_block{margin:0;border:none;padding:0;background:none;}

/* Light presets veil the photo with paper and set ink type; dark presets invert
   it. Picking a preset in the builder's Background panel IS the light/dark
   switch — presets 1 and 5 are the two ends, 2-4 are intermediate. */
.s_jd_quotepage.o_cc1 .s_jd_quotepage_scrim,
.s_jd_quotepage.o_cc2 .s_jd_quotepage_scrim,
.s_jd_quotepage.o_cc3 .s_jd_quotepage_scrim{background:rgba(242,236,223,.72);}
.s_jd_quotepage.o_cc4 .s_jd_quotepage_scrim,
.s_jd_quotepage.o_cc5 .s_jd_quotepage_scrim{background:rgba(16,12,8,.62);}

/* every <p> in the blockquote, not just .s_jd_quotepage_text: the editor
   re-nests text into sibling <p>s when a link is applied, and the quote would
   silently drop to body type if only the first were styled (see .s_jd_quotes) */
.s_jd_quotepage .s_jd_quotepage_block p,
.s_jd_quotepage .s_jd_quotepage_block p a{font-family:var(--font-serif);font-style:italic;font-size:clamp(1.75rem,5vw,3.5rem);line-height:1.18;letter-spacing:-0.01em;margin:0 auto;max-width:26ch;text-wrap:balance;}

/* Body links read as highlighter strokes rather than coloured text. The colour

   a design-system token; --jd-link-hl is the single place to change it, e.g. to
   the brand vermilion 203,65,39.

   The band is a gradient rather than a plain background-color so its height is
   controllable: a background-color fills the whole inline content box. It runs
   .52em to 1.0em, which is x-height to baseline, so it clears the ascenders
   above and stops before the descenders below - the mark sits inside the word
   rather than boxing it. box-decoration-break keeps the padding and the band on
   every line a link wraps onto, not just the first and last.

   The text itself is ink, the same colour as the body, so the highlight is the
   entire signal. It rests at .20 and deepens to .38 on hover, and the
   type thickens by faux bold rather than by font-weight, so the hover costs no
   reflow.

   The entry CTA keeps its own vermilion-rule treatment, so it is excluded. */
#wrap #o_wblog_post_content .o_wblog_post_content_field p:not(.jd-entry-cta) a{
  --jd-link-hl:101,67,92;
  background-image:linear-gradient(rgba(var(--jd-link-hl),.20),rgba(var(--jd-link-hl),.20));
  background-repeat:no-repeat;
  color:var(--ink);
  background-size:100% .48em;
  background-position:0 .52em;
  padding:0 .28em;
  border-radius:2px;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}
#wrap #o_wblog_post_content .o_wblog_post_content_field p:not(.jd-entry-cta) a:hover{
  background-image:linear-gradient(rgba(var(--jd-link-hl),.38),rgba(var(--jd-link-hl),.38));
  /* Faux bold. Painting the glyph's own colour a fraction of an em to either
     side thickens the stroke while the text metrics stay exactly as they were,
     so nothing re-measures and the line does not shift under the cursor. A real
     font-weight change would reflow the paragraph and move the link the reader
     is already pointing at. */
  text-shadow:.028em 0 0 currentColor,-.028em 0 0 currentColor;
}
